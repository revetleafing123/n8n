# Hostless app configuration (https://docs.hostless.cloud/app/hostlessfile)
#
# The build system (Docker) is selected in the dashboard, NOT here —
# putting `dockerfile_path` under `build:` fails schema validation with
# "whitelistValidation: property dockerfile_path should not exist".
# Hostless looks for ./Dockerfile in the repo root by default anyway.

# n8n is stateful: exactly one replica, never scaled horizontally.
scaling:
  min_replicas: 1
  max_replicas: 1
  min_memory: 256
  max_memory: 768   # stay inside Hostless free pool (1 GiB shared, incl. DB)

# n8n health endpoint.
health_check:
  type: http
  http_path: "/healthz"
  interval_in_seconds: 30
