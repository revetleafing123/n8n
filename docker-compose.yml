services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Asia/Kolkata
      - GENERIC_TIMEZONE=Asia/Kolkata

volumes:
  n8n_data:
    external: true
